name: Build Electron 32.3.3 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-32-windows-experiment
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      ELECTRON_BUILD_ROOT: C:\electron-build
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Free disk space
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'This cleanup is only for a disposable GitHub-hosted runner.'
          }

          $before = (Get-PSDrive C).Free
          $paths = @(
            'C:\Android',
            'C:\Miniconda',
            'C:\msys64',
            'C:\vcpkg',
            'C:\Program Files\Java',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server'
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Write-Host "Removing $path"
              try {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
              } catch {
                Write-Warning "Cleanup of $path was incomplete: $_"
              }
            }
          }

          $after = (Get-PSDrive C).Free
          $diskSummary = 'C: free disk went from {0:N1} to {1:N1} GiB ({2:N1} GiB reclaimed).' -f ($before / 1GB), ($after / 1GB), (($after - $before) / 1GB)
          Write-Host $diskSummary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $diskSummary
          if ($after -lt 100GB) {
            Write-Warning 'Less than 100 GiB is free. The source build may run out of disk space.'
          }

      - name: Sync Electron and Chromium sources
        shell: pwsh
        run: |
          # Keep Electron's patch files and Chromium's sources in LF form.
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global user.name 'electron-autobuild'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global user.email 'actions@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Path $env:ELECTRON_BUILD_ROOT | Out-Null
          Set-Location $env:ELECTRON_BUILD_ROOT
          git clone --branch v32.3.3 --depth 1 https://github.com/electron/electron.git src/electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $electronCommit = git -C src/electron rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($electronCommit -ne 'b6bca84d71aaba3b50d7ed00b3e6565f3e31657f') {
            throw "Unexpected Electron v32.3.3 commit: $electronCommit"
          }

          git init depot_tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C depot_tools fetch --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git 31e21628c3a558d4f2189712e25849d608b3ff8c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C depot_tools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The pinned depot_tools expects bundled Git on Windows. Use the runner's Git.
          $gitCache = Get-Content -LiteralPath depot_tools/git_cache.py -Raw
          $gitCache.Replace("'git.bat' if", "'git.exe' if") |
            Set-Content -LiteralPath depot_tools/git_cache.py -Encoding utf8NoBOM -NoNewline
          $env:PATH = "$env:ELECTRON_BUILD_ROOT\depot_tools;$env:PATH"

          gclient.bat config --name src/electron --unmanaged --custom-var=checkout_pgo_profiles=False https://github.com/electron/electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gclient.bat sync --no-history --jobs=4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host ('Free after source sync: {0:N1} GiB.' -f ((Get-PSDrive C).Free / 1GB))

      - name: Build the Windows x64 distribution
        shell: pwsh
        run: |
          $ninja = (Get-Command ninja.exe -CommandType Application).Source
          $env:PATH = "$env:ELECTRON_BUILD_ROOT\depot_tools;$env:PATH"
          Set-Location "$env:ELECTRON_BUILD_ROOT\src"
          $env:CHROMIUM_BUILDTOOLS_PATH = "$env:ELECTRON_BUILD_ROOT\src\buildtools"
          New-Item -ItemType Directory -Path out/Release -Force | Out-Null
          @'
          import("//electron/build/args/release.gn")
          target_cpu = "x64"
          chrome_pgo_phase = 0
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          '@ | Set-Content -Path out/Release/args.gn -Encoding ascii
          & .\buildtools\win\gn.exe gen out/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ninja -C out/Release electron:electron_dist_zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:ELECTRON_RUN_AS_NODE = '1'
          $version = & .\out\Release\electron.exe -p 'process.versions.electron + " " + process.arch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne '32.3.3 x64') {
            throw "Unexpected Electron version or architecture: $version"
          }
          Move-Item -LiteralPath out/Release/dist.zip -Destination "$env:ELECTRON_BUILD_ROOT\electron-v32.3.3-win32-x64.zip"
          Get-FileHash -Algorithm SHA256 "$env:ELECTRON_BUILD_ROOT\electron-v32.3.3-win32-x64.zip"

      - name: Report remaining build disk
        if: always()
        shell: pwsh
        run: |
          $diskSummary = 'C: free disk at end of run: {0:N1} GiB.' -f ((Get-PSDrive C).Free / 1GB)
          Write-Host $diskSummary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $diskSummary

      - name: Upload Electron ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-v32.3.3-win32-x64
          path: C:/electron-build/electron-v32.3.3-win32-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
