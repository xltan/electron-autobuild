name: Build Electron 32.3.3 for Windows

on:
  workflow_dispatch:
    inputs:
      checkpoint-key:
        description: Optional compiler checkpoint from an earlier run
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: electron-32-windows-experiment
  cancel-in-progress: false

jobs:
  first:
    name: Build and save compiler output
    uses: ./.github/workflows/electron-32-windows-job.yml
    with:
      checkpoint-key: ${{ inputs.checkpoint-key }}

  second:
    name: Finish from compiler checkpoint
    needs: first
    if: needs.first.outputs.checkpoint-key != ''
    uses: ./.github/workflows/electron-32-windows-job.yml
    with:
      checkpoint-key: ${{ needs.first.outputs.checkpoint-key }}
      final-pass: true
