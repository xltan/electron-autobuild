name: Electron 32.3.3 Windows build job

on:
  workflow_call:
    inputs:
      final-pass:
        description: Require a finished ZIP after saving any remaining checkpoint
        type: boolean
        default: false
      checkpoint-key:
        description: Cache key from the previous job
        type: string
        default: ''
    outputs:
      checkpoint-key:
        description: Cache key to resume an interrupted compile
        value: ${{ jobs.build.outputs.checkpoint-key }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 8
    outputs:
      checkpoint-key: ${{ steps.compile.outputs.checkpoint-key }}
    env:
      ELECTRON_BUILD_ROOT: C:\electron-build
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GIT_TERMINAL_PROMPT: '0'
      SCCACHE_DIR: C:\electron-sccache
      SCCACHE_CACHE_SIZE: 8G
      SCCACHE_IDLE_TIMEOUT: '0'

    steps:
      - name: Download the official Electron 32.3.3 Windows ZIP as a test fixture
        id: compile
        shell: pwsh
        run: |
          $out = Join-Path $env:ELECTRON_BUILD_ROOT 'src\out\Release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $archive = Join-Path $out 'dist.zip'
          Invoke-WebRequest -Uri 'https://github.com/electron/electron/releases/download/v32.3.3/electron-v32.3.3-win32-x64.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($digest -ne '8fb1d3647eb17f7eecaa8e1711ff1f2febdf7dd3eb89af76a32a258618727e13') {
            throw "Unexpected fixture SHA-256: $digest"
          }

      - name: Stage Electron ZIP
        id: package
        if: steps.compile.outputs.checkpoint-key == ''
        shell: pwsh
        run: |
          $archive = Join-Path $env:ELECTRON_BUILD_ROOT 'electron-v32.3.3-win32-x64.zip'
          Move-Item -LiteralPath "$env:ELECTRON_BUILD_ROOT\src\out\Release\dist.zip" -Destination $archive
          Get-FileHash -LiteralPath $archive -Algorithm SHA256

      - name: Verify packaged Electron version and architecture
        id: verify
        if: steps.package.outcome == 'success'
        timeout-minutes: 3
        shell: pwsh
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          $archive = Join-Path $env:ELECTRON_BUILD_ROOT 'electron-v32.3.3-win32-x64.zip'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'electron-version-check'
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeDir
          $probe = Join-Path $smokeDir 'check-version.cjs'
          $env:ELECTRON_VERSION_PROBE_RESULT = Join-Path $smokeDir 'electron-version.txt'
          # A Windows GUI executable can finish without returning stdout to PowerShell.
          @'
          const { writeFileSync } = require('node:fs');
          writeFileSync(process.env.ELECTRON_VERSION_PROBE_RESULT, `${process.versions.electron} ${process.arch}`);
          '@ | Set-Content -LiteralPath $probe -Encoding ascii
          $electron = Start-Process -FilePath (Join-Path $smokeDir 'electron.exe') `
            -ArgumentList ('"{0}"' -f $probe) -WorkingDirectory $smokeDir -NoNewWindow -Wait -PassThru
          if ($electron.ExitCode -ne 0) {
            throw "Electron version probe exited with code $($electron.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $env:ELECTRON_VERSION_PROBE_RESULT -PathType Leaf)) {
            throw 'Electron exited without writing its version and architecture.'
          }
          $version = Get-Content -LiteralPath $env:ELECTRON_VERSION_PROBE_RESULT -Raw
          if ($version -ne '32.3.3 x64') {
            throw "Unexpected Electron version or architecture: $version"
          }
          Write-Host "Verified Electron $version."

      - name: Upload Electron ZIP
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verify.outcome == 'success' && 'electron-v32.3.3-win32-x64' || 'electron-v32.3.3-win32-x64-unverified' }}
          path: C:/electron-build/electron-v32.3.3-win32-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
